# Modern `template:` integration covers wrapping the Shelly Plus 2PM switch outputs.
#
# Included via `template: !include covers/template_covers.yaml` in configuration.yaml.
#
# open_cover / close_cover use the Shelly per-channel power sensor to detect when
# the motor hits the endstop (power drops below 5 W) rather than a fixed timer.
# A 2 s spin-up grace period prevents a false-positive immediately after turn_on.
# A 65 s safety timeout cuts power if the sensor never updates (network glitch, etc.)
#
# set_cover_position stays time-based (570 ms per percent) because partial moves
# need to stop BEFORE the endstop — power drop there would already mean overshoot.
#
# Wiring: Output 0 = UP (open), Output 1 = DOWN (close)
# Named Shellys  (bathroomstoren, bedroomstoren*) use _switch_0/_switch_1
# Unnamed Shellys (shellyplus2pm_<mac>)            use _output_0/_output_1
# Exception: shellyplus2pm_ccdba7d08e80            uses _switch_0/_switch_1

- cover:

    # ------------------------------------------------------------------ #
    # Bathroom                                                            #
    # ------------------------------------------------------------------ #
    - name: Bathroom Storen
      default_entity_id: cover.bathroomstoren
      device_class: shutter
      position: "{{ states('input_number.bathroomstoren_position') | int(0) }}"
      open_cover:
        - action: switch.turn_off
          target:
            entity_id: switch.bathroomstoren_switch_1
        - action: switch.turn_on
          target:
            entity_id: switch.bathroomstoren_switch_0
        - delay: "00:00:02"
        - wait_template: "{{ states('sensor.bathroomstoren_switch_0_power') | float(0) < 5 }}"
          timeout: "00:01:05"
          continue_on_timeout: true
        - action: switch.turn_off
          target:
            entity_id: switch.bathroomstoren_switch_0
        - action: input_number.set_value
          data:
            entity_id: input_number.bathroomstoren_position
            value: 100
      close_cover:
        - action: switch.turn_off
          target:
            entity_id: switch.bathroomstoren_switch_0
        - action: switch.turn_on
          target:
            entity_id: switch.bathroomstoren_switch_1
        - delay: "00:00:02"
        - wait_template: "{{ states('sensor.bathroomstoren_switch_1_power') | float(0) < 5 }}"
          timeout: "00:01:05"
          continue_on_timeout: true
        - action: switch.turn_off
          target:
            entity_id: switch.bathroomstoren_switch_1
        - action: input_number.set_value
          data:
            entity_id: input_number.bathroomstoren_position
            value: 0
      stop_cover:
        - action: switch.turn_off
          target:
            entity_id: switch.bathroomstoren_switch_0
        - action: switch.turn_off
          target:
            entity_id: switch.bathroomstoren_switch_1
      set_cover_position:
        - choose:
            - conditions: "{{ position | int > states('input_number.bathroomstoren_position') | int(0) }}"
              sequence:
                - action: switch.turn_off
                  target:
                    entity_id: switch.bathroomstoren_switch_1
                - action: switch.turn_on
                  target:
                    entity_id: switch.bathroomstoren_switch_0
                - delay:
                    milliseconds: "{{ ((position | int - states('input_number.bathroomstoren_position') | int(0)) * 570) | int }}"
                - action: switch.turn_off
                  target:
                    entity_id: switch.bathroomstoren_switch_0
            - conditions: "{{ position | int < states('input_number.bathroomstoren_position') | int(0) }}"
              sequence:
                - action: switch.turn_off
                  target:
                    entity_id: switch.bathroomstoren_switch_0
                - action: switch.turn_on
                  target:
                    entity_id: switch.bathroomstoren_switch_1
                - delay:
                    milliseconds: "{{ ((states('input_number.bathroomstoren_position') | int(0) - position | int) * 570) | int }}"
                - action: switch.turn_off
                  target:
                    entity_id: switch.bathroomstoren_switch_1
        - action: input_number.set_value
          data:
            entity_id: input_number.bathroomstoren_position
            value: "{{ position | int }}"

