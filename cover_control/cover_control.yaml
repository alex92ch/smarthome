blueprint:
  name: cover_control
  description: |
    Unified cover control automation.

    - Hot mode (heat protection): closes the shutter when the sun hits the window
      AND the outdoor temperature is above hot_threshold. Optional vent position
      lifts the shutter by a small amount after closing to open the inter-slat
      slits (for plant rooms). Optional bedtime window forces close during the
      configured night-time window (for bedrooms).
    - Cold mode (night insulation): closes the shutter at night when the outdoor
      temperature is below cold_threshold. Always fully closes (no vent step).
      For bedrooms it stays closed until bedtime_open_at instead of sunrise so
      the motor doesn't run before wake time.

    Manual interrupts (stop / reverse mid-move) are respected: var is set
    BEFORE the motor command and the vent step is gated on the actual final
    position, so the automation will not fight a manual override.
  domain: automation
  source_url: https://github.com/alex92ch/smarthome/cover_control/cover_control.yaml
  input:
    cover_entity:
      name: Cover
      selector:
        entity:
          domain: cover
    temperature:
      name: Weather service
      description: Weather entity providing outdoor temperature
      selector:
        entity:
          domain: weather

    sun_position_start:
      name: Sun azimuth start
      description: Sun azimuth above which the shutter could be triggered
      default: 89
      selector:
        number:
          min: 0
          max: 360
          unit_of_measurement: °
    sun_position_end:
      name: Sun azimuth end
      description: Sun azimuth below which the shutter could be triggered
      default: 200
      selector:
        number:
          min: 0
          max: 360
          unit_of_measurement: °
    sun_elevation_start:
      name: Sun elevation start
      description: Sun elevation above which the shutter could be triggered
      default: 32
      selector:
        number:
          min: -100
          max: 360
          unit_of_measurement: °

    hot_threshold:
      name: Hot threshold
      description: Outdoor temperature above which heat-protection close is active
      default: 20
      selector:
        number:
          min: 0
          max: 40
          unit_of_measurement: °C
    cold_threshold:
      name: Cold threshold
      description: Outdoor temperature below which night-insulation close is active
      default: 8
      selector:
        number:
          min: -20
          max: 30
          unit_of_measurement: °C

    enable_vent_position:
      name: Enable vent position (plant rooms)
      description: After fully closing in hot mode, lift the shutter slightly to open the slat slits
      default: false
      selector:
        boolean:
    vent_position:
      name: Vent position
      description: Position to lift after closing for the slat slit effect (smaller = tighter slits)
      default: 1
      selector:
        number:
          min: 1
          max: 10
          unit_of_measurement: '%'

    enable_bedtime_close:
      name: Enable bedtime close (bedrooms)
      description: Force shutter closed during the bedtime window in hot mode and delay cold-mode opening to bedtime_open_at
      default: false
      selector:
        boolean:
    bedtime_close_at:
      name: Bedtime close time
      description: Start of the bedtime close window (used in hot mode)
      default: "20:00:00"
      selector:
        time:
    bedtime_open_at:
      name: Bedtime open time
      description: End of the bedtime close window. Also the morning open time in cold mode for bedrooms.
      default: "11:00:00"
      selector:
        time:

variables:
  cover_e: !input cover_entity
  var_e: "{{ 'var.' + cover_e[6:] }}"
  protection_begin: !input sun_position_start
  protection_end: !input sun_position_end
  elevation_begin: !input sun_elevation_start
  hot_threshold: !input hot_threshold
  cold_threshold: !input cold_threshold
  temperature_service: !input temperature
  enable_vent_position: !input enable_vent_position
  vent_position: !input vent_position
  enable_bedtime_close: !input enable_bedtime_close
  bedtime_close_at: !input bedtime_close_at
  bedtime_open_at: !input bedtime_open_at

mode: parallel

trigger:
  - platform: time_pattern
    minutes: '/5'

action:
  - choose:
      ##########################################################
      # close cover - hot mode (heat protection)
      ##########################################################
      - conditions:
          - condition: template
            value_template: "{{ is_state('input_boolean.cover_manage_cover_with_sun', 'on') }}"
          - condition: template
            value_template: "{{ states(var_e) | int(default=0) != 1 }}"
          - condition: template
            value_template: "{{ state_attr(temperature_service, 'temperature') | float(default=15) > hot_threshold }}"
          - condition: or
            conditions:
              # Direct sun on the window
              - condition: template
                value_template: >
                  {{ state_attr('sun.sun', 'azimuth') > protection_begin
                    and state_attr('sun.sun', 'azimuth') < protection_end
                    and state_attr('sun.sun', 'elevation') > elevation_begin }}
              # Bedroom bedtime window (overnight wrap)
              - condition: template
                value_template: >
                  {% set t = now().strftime('%H:%M:%S') %}
                  {{ enable_bedtime_close and (t >= bedtime_close_at or t < bedtime_open_at) }}
        sequence:
          # Mark engaged FIRST so a manual interrupt is preserved across ticks
          - service: var.set
            data:
              entity_id: '{{ var_e }}'
              value: 1
          - service: cover.close_cover
            data:
              entity_id: '{{ cover_e }}'
          - wait_template: "{{ states(cover_e) not in ['opening', 'closing'] }}"
            timeout: "00:10:00"
            continue_on_timeout: true
          # Settle delay: lets the integration finalize state/position attributes
          # after the motor stops, before we evaluate the vent gate.
          - delay:
              seconds: 2
          # Vent step: only if enabled AND shutter actually fully closed (not interrupted)
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ enable_vent_position }}"
                  - condition: template
                    value_template: "{{ states(cover_e) == 'closed' }}"
                sequence:
                  - service: cover.set_cover_position
                    target:
                      entity_id: '{{ cover_e }}'
                    data:
                      position: "{{ vent_position | int }}"

      ##########################################################
      # close cover - cold mode (night insulation)
      ##########################################################
      - conditions:
          - condition: template
            value_template: "{{ is_state('input_boolean.cover_manage_cover_with_sun', 'on') }}"
          - condition: template
            value_template: "{{ states(var_e) | int(default=0) != 2 }}"
          - condition: template
            value_template: "{{ state_attr(temperature_service, 'temperature') | float(default=15) < cold_threshold }}"
          # Close window: night for everyone, plus pre-bedtime_open_at morning for bedrooms
          - condition: template
            value_template: >
              {% set t = now().strftime('%H:%M:%S') %}
              {% set is_night = is_state('sun.sun', 'below_horizon') %}
              {% set bedroom_morning = enable_bedtime_close and (t < bedtime_open_at) %}
              {{ is_night or bedroom_morning }}
        sequence:
          - service: var.set
            data:
              entity_id: '{{ var_e }}'
              value: 2
          - service: cover.close_cover
            data:
              entity_id: '{{ cover_e }}'
          - wait_template: "{{ states(cover_e) not in ['opening', 'closing'] }}"
            timeout: "00:10:00"
            continue_on_timeout: true

      ##########################################################
      # open cover
      ##########################################################
      - conditions:
          - condition: template
            value_template: "{{ is_state('input_boolean.cover_manage_cover_with_sun', 'on') }}"
          - condition: template
            value_template: "{{ states(var_e) | int(default=0) > 0 }}"
          # Only open if NEITHER hot-close nor cold-close conditions still apply
          - condition: template
            value_template: >
              {% set temp = state_attr(temperature_service, 'temperature') | float(default=15) %}
              {% set is_hot = temp > hot_threshold %}
              {% set is_cold = temp < cold_threshold %}
              {% set sun_hit = state_attr('sun.sun', 'azimuth') > protection_begin
                  and state_attr('sun.sun', 'azimuth') < protection_end
                  and state_attr('sun.sun', 'elevation') > elevation_begin %}
              {% set t = now().strftime('%H:%M:%S') %}
              {% set bedtime_active = enable_bedtime_close and (t >= bedtime_close_at or t < bedtime_open_at) %}
              {% set hot_close = is_hot and (sun_hit or bedtime_active) %}
              {% set is_night = is_state('sun.sun', 'below_horizon') %}
              {% set bedroom_morning = enable_bedtime_close and (t < bedtime_open_at) %}
              {% set cold_close = is_cold and (is_night or bedroom_morning) %}
              {{ not hot_close and not cold_close }}
        sequence:
          # Mark released FIRST so a manual interrupt is preserved across ticks
          - service: var.set
            data:
              entity_id: '{{ var_e }}'
              value: 0
          - service: cover.open_cover
            data:
              entity_id: '{{ cover_e }}'
