blueprint:
  name: cover_control
  description: |
    Unified cover control automation.

    Three independent close modes, plus an open mode that releases the shutter
    only when no close mode applies.

    - Hot mode (heat protection, var=1): closes when sun hits the window AND
      outdoor temperature is above hot_threshold. Optional vent position lifts
      the shutter slightly afterwards to open the inter-slat slits (plant rooms).
    - Bedtime mode (bedrooms, var=3): closes fully (pos 0) during the configured
      bedtime window REGARDLESS of temperature or sun. Use case: bedrooms that
      should be dark from bedtime_close_at to bedtime_open_at no matter the
      weather (prevents being woken in summer by a morning hot-mode close, and
      keeps heat in during winter nights). Bedtime overrides hot/cold: the hot
      and cold branches are blocked while the bedtime window is active.
    - Cold mode (night insulation, var=2): closes fully at night when outdoor
      temperature is below cold_threshold. No vent step.

    Manual interrupts (stop / reverse mid-move) are respected: var is set
    BEFORE the motor command and the vent step is gated on the actual final
    position, so the automation will not fight a manual override.
  domain: automation
  source_url: https://github.com/alex92ch/smarthome/cover_control/cover_control.yaml
  input:
    cover_entity:
      name: Cover
      selector:
        entity:
          domain: cover
    temperature:
      name: Weather service
      description: Weather entity providing outdoor temperature
      selector:
        entity:
          domain: weather

    sun_position_start:
      name: Sun azimuth start
      description: Sun azimuth above which the shutter could be triggered
      default: 89
      selector:
        number:
          min: 0
          max: 360
          unit_of_measurement: °
    sun_position_end:
      name: Sun azimuth end
      description: Sun azimuth below which the shutter could be triggered
      default: 200
      selector:
        number:
          min: 0
          max: 360
          unit_of_measurement: °
    sun_elevation_start:
      name: Sun elevation start
      description: Sun elevation above which the shutter could be triggered
      default: 32
      selector:
        number:
          min: -100
          max: 360
          unit_of_measurement: °

    hot_threshold:
      name: Hot threshold
      description: Outdoor temperature above which heat-protection close is active. Default 10 °C because direct sun warms the room well before air temperature climbs.
      default: 10
      selector:
        number:
          min: 0
          max: 40
          unit_of_measurement: °C
    cold_threshold:
      name: Cold threshold
      description: Outdoor temperature below which night-insulation close is active
      default: 8
      selector:
        number:
          min: -20
          max: 30
          unit_of_measurement: °C

    enable_vent_position:
      name: Enable vent position (plant rooms)
      description: After fully closing in hot mode, lift the shutter slightly to open the slat slits
      default: false
      selector:
        boolean:
    vent_position:
      name: Vent position
      description: Position to lift after closing for the slat slit effect (smaller = tighter slits)
      default: 1
      selector:
        number:
          min: 1
          max: 10
          unit_of_measurement: '%'

    enable_bedtime_close:
      name: Enable bedtime close (bedrooms)
      description: Force shutter fully closed during the bedtime window regardless of temperature or sun. Overrides hot and cold modes.
      default: false
      selector:
        boolean:
    bedtime_close_at:
      name: Bedtime close time
      description: Start of the bedtime close window
      default: "20:00:00"
      selector:
        time:
    bedtime_open_at:
      name: Bedtime open time
      description: End of the bedtime close window
      default: "11:00:00"
      selector:
        time:

variables:
  cover_e: !input cover_entity
  var_e: "{{ 'var.' + cover_e[6:] }}"
  protection_begin: !input sun_position_start
  protection_end: !input sun_position_end
  elevation_begin: !input sun_elevation_start
  hot_threshold: !input hot_threshold
  cold_threshold: !input cold_threshold
  temperature_service: !input temperature
  enable_vent_position: !input enable_vent_position
  vent_position: !input vent_position
  enable_bedtime_close: !input enable_bedtime_close
  bedtime_close_at: !input bedtime_close_at
  bedtime_open_at: !input bedtime_open_at

mode: parallel

trigger:
  - platform: time_pattern
    minutes: '/5'

action:
  - choose:
      ##########################################################
      # close cover - hot mode (heat protection)
      # Skipped while bedtime is active so it can't override bedtime's full close.
      ##########################################################
      - conditions:
          - condition: template
            value_template: "{{ is_state('input_boolean.cover_manage_cover_with_sun', 'on') }}"
          - condition: template
            value_template: "{{ states(var_e) | int(default=0) != 1 }}"
          - condition: template
            value_template: >
              {% set t = now().strftime('%H:%M:%S') %}
              {% set bedtime_active = enable_bedtime_close and (t >= bedtime_close_at or t < bedtime_open_at) %}
              {{ not bedtime_active }}
          - condition: template
            value_template: "{{ state_attr(temperature_service, 'temperature') | float(default=15) > hot_threshold }}"
          - condition: template
            value_template: >
              {{ state_attr('sun.sun', 'azimuth') > protection_begin
                and state_attr('sun.sun', 'azimuth') < protection_end
                and state_attr('sun.sun', 'elevation') > elevation_begin }}
        sequence:
          # Mark engaged FIRST so a manual interrupt is preserved across ticks
          - service: var.set
            data:
              entity_id: '{{ var_e }}'
              value: 1
          - service: cover.close_cover
            data:
              entity_id: '{{ cover_e }}'
          - wait_template: "{{ states(cover_e) not in ['opening', 'closing'] }}"
            timeout: "00:10:00"
            continue_on_timeout: true
          # Settle delay: lets the integration finalize state/position attributes
          # after the motor stops, before we evaluate the vent gate. Some covers
          # (Shelly) take a few seconds to push the final state/position update
          # to HA after the motor stops.
          - delay:
              seconds: 5
          # Vent step: only if enabled AND shutter actually reached fully closed
          # (not manually interrupted). Gate accepts EITHER state == 'closed'
          # OR current_position == 0 because some integrations report state
          # 'open' transiently even when position has reached 0.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ enable_vent_position }}"
                  - condition: template
                    value_template: >
                      {{ states(cover_e) == 'closed'
                         or (state_attr(cover_e, 'current_position') | int(default=100)) == 0 }}
                sequence:
                  - service: cover.set_cover_position
                    target:
                      entity_id: '{{ cover_e }}'
                    data:
                      position: "{{ vent_position | int }}"

      ##########################################################
      # close cover - bedtime mode (bedrooms)
      # Independent of temperature and sun. Fully closes (no vent step).
      # Wins over hot/cold (they're guarded), so bedtime is the final state
      # for the entire bedtime window even if the shutter was previously
      # vented (var=1) or cold-closed (var=2).
      ##########################################################
      - conditions:
          - condition: template
            value_template: "{{ is_state('input_boolean.cover_manage_cover_with_sun', 'on') }}"
          - condition: template
            value_template: "{{ enable_bedtime_close }}"
          - condition: template
            value_template: "{{ states(var_e) | int(default=0) != 3 }}"
          - condition: template
            value_template: >
              {% set t = now().strftime('%H:%M:%S') %}
              {{ t >= bedtime_close_at or t < bedtime_open_at }}
        sequence:
          - service: var.set
            data:
              entity_id: '{{ var_e }}'
              value: 3
          - service: cover.close_cover
            data:
              entity_id: '{{ cover_e }}'
          - wait_template: "{{ states(cover_e) not in ['opening', 'closing'] }}"
            timeout: "00:10:00"
            continue_on_timeout: true

      ##########################################################
      # close cover - cold mode (night insulation)
      # Skipped while bedtime is active (bedtime already keeps it closed).
      ##########################################################
      - conditions:
          - condition: template
            value_template: "{{ is_state('input_boolean.cover_manage_cover_with_sun', 'on') }}"
          - condition: template
            value_template: "{{ states(var_e) | int(default=0) != 2 }}"
          - condition: template
            value_template: >
              {% set t = now().strftime('%H:%M:%S') %}
              {% set bedtime_active = enable_bedtime_close and (t >= bedtime_close_at or t < bedtime_open_at) %}
              {{ not bedtime_active }}
          - condition: template
            value_template: "{{ state_attr(temperature_service, 'temperature') | float(default=15) < cold_threshold }}"
          - condition: state
            entity_id: sun.sun
            state: below_horizon
        sequence:
          - service: var.set
            data:
              entity_id: '{{ var_e }}'
              value: 2
          - service: cover.close_cover
            data:
              entity_id: '{{ cover_e }}'
          - wait_template: "{{ states(cover_e) not in ['opening', 'closing'] }}"
            timeout: "00:10:00"
            continue_on_timeout: true

      ##########################################################
      # open cover
      # Only releases when NONE of the three close modes applies.
      ##########################################################
      - conditions:
          - condition: template
            value_template: "{{ is_state('input_boolean.cover_manage_cover_with_sun', 'on') }}"
          - condition: template
            value_template: "{{ states(var_e) | int(default=0) > 0 }}"
          - condition: template
            value_template: >
              {% set temp = state_attr(temperature_service, 'temperature') | float(default=15) %}
              {% set is_hot = temp > hot_threshold %}
              {% set is_cold = temp < cold_threshold %}
              {% set sun_hit = state_attr('sun.sun', 'azimuth') > protection_begin
                  and state_attr('sun.sun', 'azimuth') < protection_end
                  and state_attr('sun.sun', 'elevation') > elevation_begin %}
              {% set t = now().strftime('%H:%M:%S') %}
              {% set bedtime_active = enable_bedtime_close and (t >= bedtime_close_at or t < bedtime_open_at) %}
              {% set is_night = is_state('sun.sun', 'below_horizon') %}
              {% set hot_close = is_hot and sun_hit %}
              {% set cold_close = is_cold and is_night %}
              {{ not hot_close and not bedtime_active and not cold_close }}
        sequence:
          # Mark released FIRST so a manual interrupt is preserved across ticks
          - service: var.set
            data:
              entity_id: '{{ var_e }}'
              value: 0
          - service: cover.open_cover
            data:
              entity_id: '{{ cover_e }}'
