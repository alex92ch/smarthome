blueprint:
  name: cover_control
  description: |
    Unified cover control automation.

    Four modes (var values 0–3), evaluated in order every 5 minutes:

    - Hot mode (var=1): closes when sun hits the window AND outdoor temperature
      is above hot_threshold. Optional vent position lifts the shutter slightly
      afterwards to open the inter-slat slits (plant rooms). Skipped while
      bedtime or cold-lock is active.
    - Bedtime mode (var=3, bedrooms only): closes fully (pos 0) during the
      configured bedtime window REGARDLESS of temperature or sun. Prevents
      being woken by a morning hot-mode motor run (summer) and keeps heat in
      overnight (winter). Overrides hot and cold while active.
    - Cold mode (var=2): one evening decision, one morning release — no
      overnight re-evaluation. At the first 5-minute tick after effective_close_at
      the shutter closes fully if temp < cold_threshold. At effective_open_at it
      always opens unconditionally. For bedrooms effective_close_at/open_at
      automatically follow bedtime_close_at/open_at so only one schedule is
      configured. For all other rooms cold_close_at (default 22:00) and
      cold_open_at (default 08:00) apply.
    - Open (var=0): cover is released. Motor runs only when transitioning from
      a closed mode; it does not repeat-open every 5 minutes.
    - External lock (var=4): set by another automation (e.g. TV mode). The
      blueprint skips ALL branches for this cover until the external automation
      resets var to 0.

    Manual interrupts (stop / reverse mid-move) are respected: var is set
    BEFORE the motor command and the vent step is gated on the actual final
    position, so the automation will not fight a manual override.
  domain: automation
  source_url: https://github.com/alex92ch/smarthome/cover_control/cover_control.yaml
  input:
    cover_entity:
      name: Cover
      selector:
        entity:
          domain: cover
    temperature:
      name: Weather service
      description: Weather entity providing outdoor temperature
      selector:
        entity:
          domain: weather

    sun_position_start:
      name: Sun azimuth start
      description: Sun azimuth above which the shutter could be triggered
      default: 89
      selector:
        number:
          min: 0
          max: 360
          unit_of_measurement: °
    sun_position_end:
      name: Sun azimuth end
      description: Sun azimuth below which the shutter could be triggered
      default: 200
      selector:
        number:
          min: 0
          max: 360
          unit_of_measurement: °
    sun_elevation_start:
      name: Sun elevation start
      description: Sun elevation above which the shutter could be triggered
      default: 32
      selector:
        number:
          min: -100
          max: 360
          unit_of_measurement: °

    hot_threshold:
      name: Hot threshold
      description: Outdoor temperature above which heat-protection close is active. Default 10 °C because direct sun warms the room well before air temperature climbs.
      default: 10
      selector:
        number:
          min: 0
          max: 40
          unit_of_measurement: °C
    cold_threshold:
      name: Cold threshold
      description: Outdoor temperature below which night-insulation close is active
      default: 8
      selector:
        number:
          min: -20
          max: 30
          unit_of_measurement: °C

    enable_vent_position:
      name: Enable vent position (plant rooms)
      description: After fully closing in hot mode, lift the shutter slightly to open the slat slits
      default: false
      selector:
        boolean:
    vent_position:
      name: Vent position
      description: Position to lift after closing for the slat slit effect (smaller = tighter slits)
      default: 1
      selector:
        number:
          min: 1
          max: 10
          unit_of_measurement: '%'

    enable_bedtime_close:
      name: Enable bedtime close (bedrooms)
      description: Force shutter fully closed during the bedtime window regardless of temperature or sun. Overrides hot and cold modes. Also sets the cold-mode night window to match bedtime times.
      default: false
      selector:
        boolean:
    bedtime_close_at:
      name: Bedtime close time
      description: Start of the bedtime close window. Also used as the cold-mode evening checkpoint when enable_bedtime_close is true.
      default: "20:00:00"
      selector:
        time:
    bedtime_open_at:
      name: Bedtime open time
      description: End of the bedtime close window. Also used as the cold-mode morning release when enable_bedtime_close is true.
      default: "11:00:00"
      selector:
        time:

    cold_close_at:
      name: Cold close time
      description: Evening time at which cold-mode insulation is evaluated for non-bedroom covers. Ignored when enable_bedtime_close is true (bedtime times take over).
      default: "22:00:00"
      selector:
        time:
    cold_open_at:
      name: Cold open time
      description: Morning time at which cold-locked covers are unconditionally opened for non-bedroom covers. Ignored when enable_bedtime_close is true.
      default: "08:00:00"
      selector:
        time:

variables:
  cover_e: !input cover_entity
  var_e: "{{ 'var.' + cover_e[6:] }}"
  protection_begin: !input sun_position_start
  protection_end: !input sun_position_end
  elevation_begin: !input sun_elevation_start
  hot_threshold: !input hot_threshold
  cold_threshold: !input cold_threshold
  temperature_service: !input temperature
  enable_vent_position: !input enable_vent_position
  vent_position: !input vent_position
  enable_bedtime_close: !input enable_bedtime_close
  bedtime_close_at: !input bedtime_close_at
  bedtime_open_at: !input bedtime_open_at
  cold_close_at: !input cold_close_at
  cold_open_at: !input cold_open_at
  # When bedtime is enabled the cold night envelope uses the same times as bedtime
  # so bedroom covers only need one schedule configured.
  effective_close_at: >
    {{ bedtime_close_at if enable_bedtime_close else cold_close_at }}
  effective_open_at: >
    {{ bedtime_open_at if enable_bedtime_close else cold_open_at }}

mode: parallel

trigger:
  - platform: time_pattern
    minutes: '/5'

action:
  - choose:
      ##########################################################
      # close cover - hot mode (heat protection, var=1)
      # Skipped while bedtime or cold-lock is active.
      ##########################################################
      - conditions:
          - condition: template
            value_template: "{{ is_state('input_boolean.cover_manage_cover_with_sun', 'on') }}"
          - condition: template
            value_template: "{{ states(var_e) | int(default=0) not in [1, 4] }}"
          - condition: template
            value_template: >
              {% set t = now().strftime('%H:%M:%S') %}
              {% set bedtime_active = enable_bedtime_close and (t >= bedtime_close_at or t < bedtime_open_at) %}
              {% set cold_window_active = t >= effective_close_at or t < effective_open_at %}
              {{ not bedtime_active and not cold_window_active }}
          - condition: template
            value_template: "{{ state_attr(temperature_service, 'temperature') | float(default=15) > hot_threshold }}"
          - condition: template
            value_template: >
              {{ state_attr('sun.sun', 'azimuth') > protection_begin
                and state_attr('sun.sun', 'azimuth') < protection_end
                and state_attr('sun.sun', 'elevation') > elevation_begin }}
        sequence:
          - service: var.set
            data:
              entity_id: '{{ var_e }}'
              value: 1
          - service: cover.close_cover
            data:
              entity_id: '{{ cover_e }}'
          - wait_template: >
              {{ states(cover_e) == 'closed'
                 or (state_attr(cover_e, 'current_position') | int(default=100)) == 0 }}
            timeout: "00:02:00"
            continue_on_timeout: true
          - delay:
              seconds: 2
          # Vent step: only if enabled AND cover actually reached pos 0 (not interrupted).
          # Gate accepts state == 'closed' OR position == 0 to handle integration
          # quirks where state lags behind the position attribute.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ enable_vent_position }}"
                  - condition: template
                    value_template: >
                      {{ states(cover_e) == 'closed'
                         or (state_attr(cover_e, 'current_position') | int(default=100)) == 0 }}
                sequence:
                  - service: cover.set_cover_position
                    target:
                      entity_id: '{{ cover_e }}'
                    data:
                      position: "{{ vent_position | int }}"

      ##########################################################
      # close cover - bedtime mode (bedrooms, var=3)
      # Independent of temperature and sun. Fully closes (no vent step).
      # Evaluated before cold so bedrooms always follow the bedtime path.
      ##########################################################
      - conditions:
          - condition: template
            value_template: "{{ is_state('input_boolean.cover_manage_cover_with_sun', 'on') }}"
          - condition: template
            value_template: "{{ enable_bedtime_close }}"
          - condition: template
            value_template: "{{ states(var_e) | int(default=0) not in [3, 4] }}"
          - condition: template
            value_template: >
              {% set t = now().strftime('%H:%M:%S') %}
              {{ t >= bedtime_close_at or t < bedtime_open_at }}
        sequence:
          - service: var.set
            data:
              entity_id: '{{ var_e }}'
              value: 3
          - service: cover.close_cover
            data:
              entity_id: '{{ cover_e }}'
          - wait_template: >
              {{ states(cover_e) == 'closed'
                 or (state_attr(cover_e, 'current_position') | int(default=100)) == 0 }}
            timeout: "00:02:00"
            continue_on_timeout: true
          - delay:
              seconds: 2

      ##########################################################
      # close cover - cold mode (night insulation, var=2)
      # Time-locked: fires only during the 5-minute window after effective_close_at.
      # This means one evening decision per night — no re-evaluation at 04:00
      # if the temperature dips during the night. Skipped while bedtime is active.
      ##########################################################
      - conditions:
          - condition: template
            value_template: "{{ is_state('input_boolean.cover_manage_cover_with_sun', 'on') }}"
          - condition: template
            value_template: "{{ states(var_e) | int(default=0) not in [2, 4] }}"
          - condition: template
            value_template: >
              {% set t = now().strftime('%H:%M:%S') %}
              {% set bedtime_active = enable_bedtime_close and (t >= bedtime_close_at or t < bedtime_open_at) %}
              {{ not bedtime_active }}
          - condition: template
            value_template: "{{ state_attr(temperature_service, 'temperature') | float(default=15) < cold_threshold }}"
          # Only fires within 5 minutes of effective_close_at
          - condition: template
            value_template: >
              {% set ch = effective_close_at[0:2] | int %}
              {% set cm = effective_close_at[3:5] | int %}
              {% set close_total = ch * 60 + cm %}
              {% set now_total = now().hour * 60 + now().minute %}
              {{ (now_total - close_total) % 1440 < 5 }}
        sequence:
          - service: var.set
            data:
              entity_id: '{{ var_e }}'
              value: 2
          - service: cover.close_cover
            data:
              entity_id: '{{ cover_e }}'
          - wait_template: >
              {{ states(cover_e) == 'closed'
                 or (state_attr(cover_e, 'current_position') | int(default=100)) == 0 }}
            timeout: "00:02:00"
            continue_on_timeout: true
          - delay:
              seconds: 2

      ##########################################################
      # release cold lock - cold release (var=2 → 0)
      # Fires unconditionally at effective_open_at regardless of temperature.
      # Evaluated before the generic open branch so var=2 is always handled here.
      ##########################################################
      - conditions:
          - condition: template
            value_template: "{{ is_state('input_boolean.cover_manage_cover_with_sun', 'on') }}"
          - condition: template
            value_template: "{{ states(var_e) | int(default=0) == 2 }}"
          # Outside the cold window (i.e. effective_open_at has passed)
          - condition: template
            value_template: >
              {% set t = now().strftime('%H:%M:%S') %}
              {{ t >= effective_open_at and t < effective_close_at }}
        sequence:
          - service: var.set
            data:
              entity_id: '{{ var_e }}'
              value: 0
          - service: cover.open_cover
            data:
              entity_id: '{{ cover_e }}'

      ##########################################################
      # open cover - generic release (var=1 hot or var=3 bedtime → 0)
      # var=2 is handled exclusively by the cold release branch above.
      ##########################################################
      - conditions:
          - condition: template
            value_template: "{{ is_state('input_boolean.cover_manage_cover_with_sun', 'on') }}"
          - condition: template
            value_template: "{{ states(var_e) | int(default=0) in [1, 3] }}"
          - condition: template
            value_template: >
              {% set temp = state_attr(temperature_service, 'temperature') | float(default=15) %}
              {% set is_hot = temp > hot_threshold %}
              {% set sun_hit = state_attr('sun.sun', 'azimuth') > protection_begin
                  and state_attr('sun.sun', 'azimuth') < protection_end
                  and state_attr('sun.sun', 'elevation') > elevation_begin %}
              {% set t = now().strftime('%H:%M:%S') %}
              {% set bedtime_active = enable_bedtime_close and (t >= bedtime_close_at or t < bedtime_open_at) %}
              {% set cold_window_active = t >= effective_close_at or t < effective_open_at %}
              {% set hot_close = is_hot and sun_hit %}
              {{ not hot_close and not bedtime_active and not cold_window_active }}
        sequence:
          - service: var.set
            data:
              entity_id: '{{ var_e }}'
              value: 0
          - service: cover.open_cover
            data:
              entity_id: '{{ cover_e }}'
