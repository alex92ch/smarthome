# Backing input_number helpers for the template covers.
# Each stores the last-known position (0–100) of a shutter so that
# set_cover_position can calculate proportional travel time.
#
# IMPORTANT after first deploy:
#   All values default to 0 (fully closed). If a shutter is physically open
#   you must manually update the matching input_number in HA
#   (Developer Tools -> States -> input_number.X_position -> set value).

bathroomstoren_position:
  name: Bathroom Storen Position
  min: 0
  max: 100
  step: 1
  initial: 0
  mode: slider

