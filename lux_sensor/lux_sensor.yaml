esp8266:
  board: d1_mini_lite

# OTA bleibt aktiv für Updates
ota:
  platform: esphome
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 0s

# I²C-Schnittstelle
i2c:
  sda: D1
  scl: D2
  scan: false

sensor:
  - platform: bh1750
    name: "Lichtstärke"
    # update_interval: 1s
    address: 0x23
    on_value:
      then:
        - script.execute: handle_sleep
    id: lichtsensor

  - platform: adc
    pin: A0
    name: "Batteriespannung"
    id: battery_voltage
    # update_interval: 1s
    filters:
      - multiply: 5.4
    unit_of_measurement: "V"

  - platform: template
    name: "Batterieladung"
    # update_interval: 1s
    unit_of_measurement: "%"
    lambda: |-
      float voltage = id(battery_voltage).state;
      const float max_voltage = 5.4;
      const float min_voltage = 2.3;
      float percentage = ((voltage - min_voltage) / (max_voltage - min_voltage)) * 100.0;
      if (percentage < 0.0) return 0.0;
      if (percentage > 100.0) return 100.0;
      return percentage;

time:
  - platform: homeassistant
    id: esptime

deep_sleep:
  id: deep_sleep_control

script:
  - id: handle_sleep
    then:
      - delay: 19s
      - lambda: |-
          auto time = id(esptime).now();
          if (time.is_valid() && (time.hour >= 22 || time.hour < 6)) {
            id(deep_sleep_control).set_sleep_duration(28800000);  // 8h
          } else {
            id(deep_sleep_control).set_sleep_duration(1800000);   // 30min
          }
      - deep_sleep.enter:
          id: deep_sleep_control

