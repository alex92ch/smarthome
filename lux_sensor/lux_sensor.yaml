esphome:
  name: cover-lux-sensor

esp8266:
  board: d1_mini_lite

logger:
  baud_rate: 0  # stromsparend

api:
  encryption:
    key: !secret api_key

ota:
  password: !secret wifi_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light
  fast_connect: true
  reboot_timeout: 0s

i2c:
  sda: D1
  scl: D2

sensor:
  - platform: bh1750
    name: 'Lichtstärke'
    address: 0x23
    id: lichtstaerke
    update_interval: never  # manuell triggern

  - platform: adc
    pin: A0
    name: 'Batteriespannung'
    id: battery_voltage
    update_interval: never
    filters:
      - multiply: 5.4
    unit_of_measurement: 'V'

  - platform: template
    name: 'Batterieladung'
    update_interval: never
    unit_of_measurement: '%'
    lambda: |-
      float voltage = id(battery_voltage).state;
      const float max_voltage = 5.4;
      const float min_voltage = 2.3;
      float percentage = ((voltage - min_voltage) / (max_voltage - min_voltage)) * 100.0;

      if (percentage < 0.0) return 0.0;
      if (percentage > 100.0) return 100.0;
      return percentage;

deep_sleep:
  id: deep_sleep_control
  run_duration: 20s
  sleep_duration: 20min

interval:
  - interval: 2s
    then:
      - sensor.bh1750.read:
      - component.update: battery_voltage
      - delay: 2s
      - deep_sleep.enter: deep_sleep_control
