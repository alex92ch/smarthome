esphome:
  name: cover-lux-sensor

esp8266:
  board: d1_mini_lite

# Logging deaktivieren für Stromersparnis
logger:
  baud_rate: 0

# Lokale API mit Verschlüsselung für Home Assistant
api:
  encryption:
    key: !secret api_key

# OTA-Update über ESPHome mit Passwort
ota:
  password: !secret wifi_password
  platform: esphome

# WLAN-Konfiguration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light
  fast_connect: true
  reboot_timeout: 0s

# I²C für den BH1750
i2c:
  sda: D1
  scl: D2

# Helligkeitssensor
sensor:
  - platform: bh1750
    name: "Lichtstärke"
    address: 0x23
    id: lichtstaerke
    update_interval: never  # Nur manuell triggern

# Batteriespannung über A0
  - platform: adc
    pin: A0
    name: "Batteriespannung"
    id: battery_voltage
    update_interval: never
    filters:
      - multiply: 5.4  # Spannungsteiler anpassen
    unit_of_measurement: "V"

# Prozentanzeige aus Spannung berechnen
  - platform: template
    name: "Batterieladung"
    update_interval: never
    unit_of_measurement: "%"
    lambda: |-
      float voltage = id(battery_voltage).state;
      const float max_voltage = 5.4;
      const float min_voltage = 2.3;
      float percentage = ((voltage - min_voltage) / (max_voltage - min_voltage)) * 100.0;
      if (percentage < 0.0) return 0.0;
      if (percentage > 100.0) return 100.0;
      return percentage;

# Deep Sleep Konfiguration
deep_sleep:
  id: deep_sleep_control
  run_duration: 20s
  sleep_duration: 20min

# Intervall: Führe Sensorabfragen nach 2 Sekunden aus, dann schlafe wieder ein
interval:
  - interval: 2s
    then:
      - component.update: lichtstaerke
      - component.update: battery_voltage
      - delay: 2s
      - deep_sleep.enter: deep_sleep_control
