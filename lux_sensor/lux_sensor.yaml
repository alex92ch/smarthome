esphome:
  name: cover-lux-sensor
  on_boot:
    priority: -100.0
    then:
      - script.execute: handle_sleep

esp8266:
  board: d1_mini_lite

ota:
  platform: esphome
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

# logger:
#   level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 0s

i2c:
  sda: D1
  scl: D2
  scan: false

sensor:
  - platform: bh1750
    name: "Lichtstärke"
    address: 0x23
    id: lichtsensor

  - platform: adc
    pin: A0
    name: "Batteriespannung"
    id: battery_voltage
    filters:
      - multiply: 5.4
    unit_of_measurement: "V"

  - platform: template
    name: "Batterieladung"
    unit_of_measurement: "%"
    lambda: |-
      float voltage = id(battery_voltage).state;
      const float max_voltage = 5.4;
      const float min_voltage = 2.3;
      float percentage = ((voltage - min_voltage) / (max_voltage - min_voltage)) * 100.0;
      if (percentage < 0.0) return 0.0;
      if (percentage > 100.0) return 100.0;
      return percentage;

time:
  - platform: homeassistant
    id: esptime

deep_sleep:
  id: deep_sleep_control
  sleep_duration: 30min  # Fallback falls kein Script läuft

script:
  - id: handle_sleep
    then:
      - lambda: 'ESP_LOGI("script", "handle_sleep gestartet");'
      - component.update: lichtsensor
      - delay: 500ms
      - component.update: battery_voltage
      - delay: 500ms
      - lambda: 'ESP_LOGI("script", "Warte auf gültige Sensorwerte...");'
      - wait_until:
          condition:
            lambda: return id(battery_voltage).has_state() && id(lichtsensor).has_state();
          timeout: 10s
      - lambda: |-
          if (!(id(battery_voltage).has_state() && id(lichtsensor).has_state())) {
            ESP_LOGW("script", "Sensorwerte ungültig nach Timeout - fahre trotzdem fort.");
          } else {
            ESP_LOGI("script", "Sensorwerte sind gültig.");
          }

      - lambda: 'ESP_LOGI("script", "Warte auf gültige Uhrzeit...");'
      - wait_until:
          condition:
            lambda: return id(esptime).now().is_valid();
          timeout: 10s
      - lambda: |-
          if (!(id(esptime).now().is_valid())) {
            ESP_LOGW("script", "Uhrzeit ungültig nach Timeout - setze 30min als Fallback.");
            id(deep_sleep_control).set_sleep_duration(1800000);
            return;
          } else {
            ESP_LOGI("script", "Uhrzeit gültig - fahre fort.");
          }
      - delay: 1s
      - lambda: |-
          ESP_LOGD("script", "Lichtsensor: %.1f lx", id(lichtsensor).state);
          ESP_LOGD("script", "Batteriespannung: %.2f V", id(battery_voltage).state);
          auto time = id(esptime).now();
          ESP_LOGD("script", "Aktuelle Uhrzeit: %02d:%02d", time.hour, time.minute);
          if (time.hour >= 22 || time.hour < 6) {
            ESP_LOGI("script", "Nachtmodus erkannt - 8 Stunden schlafen.");
            id(deep_sleep_control).set_sleep_duration(28800000);  // 8h in ms
          } else {
            ESP_LOGI("script", "Tagmodus - 30 Minuten schlafen.");
            id(deep_sleep_control).set_sleep_duration(1800000);   // 30min in ms
          }
      - deep_sleep.enter:
          id: deep_sleep_control
